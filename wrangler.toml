# wrangler.toml — Konfigurasi Cloudflare untuk Salam Bumi Property (SBP)
# Arsitektur: Cloudflare Pages (React/Vite frontend) + Workers (API + SSR) + D1 (database) + R2 (media)

name = "sbp-final"

# compatibility_date: versi runtime Cloudflare. Gunakan tanggal terbaru yang stabil.
# nodejs_compat: aktifkan API Node.js (path, crypto, dll.) di Workers — diperlukan untuk bcrypt, UUID, dll.
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Direktori output build React Router v7 — client assets (SSR server bundle di dist/server/)
pages_build_output_dir = "dist/client"

# Folder migrasi D1 — Wrangler akan membaca file SQL dari sini secara urut
# [migrations_dir dideklarasikan per-binding di bawah]

# =============================================================================
# D1 DATABASE — sbp-db
# Binding "DB" = nama variabel yang diakses di Worker: env.DB
# database_id: diisi setelah menjalankan 'wrangler d1 create sbp-db' (Tugas 3)
# =============================================================================
[[d1_databases]]
binding = "DB"
database_name = "sbp-db"
database_id = "76019082-43b7-41b0-81c1-9f652ef7ac45"
migrations_dir = "migrations"

# =============================================================================
# R2 BUCKET — sbp-media
# Binding "MEDIA" = nama variabel di Worker: env.MEDIA
# Menyimpan: foto properti (webp), brosur PDF, arsip kontrak, tanda tangan
# =============================================================================
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sbp-media"

# =============================================================================
# R2 BUCKET — sbp-video  (binding "VIDEO" = env.VIDEO)
# Menyimpan: video Konten Agent + poster .jpg-nya. Migrasi 0043.
#
# ⚠️ SENGAJA BUCKET TERPISAH dari sbp-media, bukan folder di dalamnya.
# Bucket ini DIBUKA KE PUBLIK lewat custom domain (media.salambumi.xyz) karena
# Buffer/Zernio harus bisa mengunduh videonya tanpa autentikasi. sbp-media berisi
# signatures/ (NIK terdekripsi) dan arsip kontrak — membukanya ke publik akan
# membocorkan semuanya sekaligus.
# =============================================================================
[[r2_buckets]]
binding = "VIDEO"
bucket_name = "sbp-video"

# =============================================================================
# ENVIRONMENT VARIABLES (non-secret, safe untuk commit)
# Secret seperti API key / JWT secret -> simpan via 'wrangler secret put'
# =============================================================================
[vars]
ENVIRONMENT = "production"
APP_URL = "https://salambumi.xyz"
WA_ADMIN = "6281391278889"
ADMIN_EMAIL = "salambumiproperty@gmail.com"
# CORS: origin yang diizinkan. Dibaca oleh functions/_middleware.js (env.ALLOWED_ORIGIN || '*').
# CATATAN: Cloudflare Pages TIDAK selalu membaca [vars] dari wrangler.toml untuk project Pages —
# WAJIB juga di-set manual di Dashboard > Pages > sbp-final > Settings > Environment Variables
# (Production + Preview) dengan nama ALLOWED_ORIGIN = https://salambumi.xyz.
ALLOWED_ORIGIN = "https://salambumi.xyz"
# ⚠️ R2_PUBLIC_BASE SENGAJA TIDAK DIDAFTARKAN DI SINI.
#
# Basis URL publik bucket sbp-video (https://media.salambumi.xyz) sudah di-set
# lewat `wrangler pages secret put` untuk Production DAN Preview. Menuliskannya
# juga sebagai [vars] di file ini membuat `wrangler pages deploy` GAGAL:
#   "Binding name 'R2_PUBLIC_BASE' already in use."
# Sebabnya bentrok TIPE — var di wrangler.toml vs secret_text di Dashboard.
# (ALLOWED_ORIGIN di atas tidak bentrok karena di Dashboard tipenya plain_text.)
#
# Untuk `wrangler pages dev` lokal, taruh di .dev.vars bersama kredensial S3:
#   R2_PUBLIC_BASE="https://media.salambumi.xyz"
#
# R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY juga TIDAK di sini —
# kredensial S3 untuk presigned PUT, set via:
#   wrangler pages secret put R2_ACCESS_KEY_ID --project-name sbp-final
# Token S3-nya HARUS dibuat lewat Dashboard (R2 > Manage API tokens); OAuth
# wrangler tidak berwenang membuat API token akun (terverifikasi: HTTP 403).
# NIK_ENC_KEY TIDAK DI SINI — set via .dev.vars (lokal) atau: wrangler secret put NIK_ENC_KEY (produksi)
# TURNSTILE_SECRET — secret CAPTCHA anti-bot (titip-jual, leads, chat). Set via
#   `wrangler secret put TURNSTILE_SECRET` (Production + Preview). Selama BELUM di-set,
#   verifikasi Turnstile fail-open (form tetap jalan). Site key ada di src/app/components/Turnstile.tsx
#   (nilai publik) — ganti dari default test key ke site key produksi dari Dashboard → Turnstile.

# =============================================================================
# PREVIEW / LOCAL DEVELOPMENT
# Remote = false  -> gunakan database D1 lokal (file SQLite di .wrangler/)
# Remote = true   -> gunakan D1 di Cloudflare cloud (untuk staging test)
# =============================================================================
[dev]
port = 8787
local_protocol = "http"
