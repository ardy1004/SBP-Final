name = "viralframe-purge-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 20:10 UTC = 03:10 WIB — purge sampah, di luar jam kerja.
# 18:00-21:30 UTC tiap 30 menit = 01:00-04:30 WIB — auto-jadwal per agent.
#   Tiap agent punya jam_auto sendiri di D1; endpoint yang mencocokkan.
#   Ini jam MENGIRIM KE Buffer/Zernio, bukan jam tayang di medsos.
#
# ⚠️ Menit purge SENGAJA :10, JANGAN dikembalikan ke :00. Dulu "0 20 * * *"
# bertabrakan tepat dengan slot auto-jadwal 20:00 UTC, sedangkan handler-nya
# memilih SALAH SATU cabang lewat event.cron. Kalau Cloudflare mengirim pola
# purge di menit itu, agent ber-jam_auto 03:00 WIB (= 20:00 UTC, dipakai Ayu)
# tidak akan pernah dijadwalkan — diam total, tanpa error.
#
# 00:20-17:20 UTC tiap jam di menit :20 = 07:20-00:20 WIB — tarik metrik post
#   dari Buffer & Zernio, SATU agent per tick bergiliran (2026-11-18). Menit
#   :20 sengaja tidak pernah sama dengan :00/:30 (auto-jadwal) maupun :10
#   (purge), dan jamnya tidak menyentuh 18-21 UTC milik auto-jadwal.
[triggers]
crons = ["10 20 * * *", "0,30 18-21 * * *", "20 0-17 * * *"]

# Workers Logs (2026-11-17). Worker ini memanggil auto-schedule/purge-trash
# SEKALI tanpa retry; kalau panggilan itu gagal (5xx, D1 error), satu-satunya
# jejaknya adalah console.error di src/index.js — dan tanpa blok ini log
# tersebut tidak tersimpan sama sekali (hanya terlihat lewat `wrangler tail`
# yang sedang terbuka). Lihat di Dashboard → Workers → viralframe-purge-cron → Logs.
[observability]
enabled = true
